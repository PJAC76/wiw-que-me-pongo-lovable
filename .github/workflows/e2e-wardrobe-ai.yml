name: E2E · Wardrobe AI flow

# Desactivado temporalmente (Fase 5): no tenemos los secretos TEST_* en GitHub
# y el workflow spameaba fallos cada push/PR. Reactivar en Fase 9 como parte
# de la preparación de CI/CD para producción.
on: workflow_dispatch

concurrency:
  group: e2e-wardrobe-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wardrobe-ai-flow:
    name: Detección IA + procesamiento de fondo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Fuerza modo mock del server fn de detección para no depender del
      # AI Gateway real ni consumir créditos en cada PR.
      AI_DETECTION_MOCK: "1"
      # Credenciales del usuario de prueba (Supabase Auth) + proyecto:
      # deben existir como GitHub secrets. Ver README de tests/e2e.
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      # Necesario para crear/actualizar el usuario de test vía Admin API.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Guard — required secrets present
        run: |
          missing=()
          for v in TEST_EMAIL TEST_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium

      - name: Ensure test user (create or update password)
        run: bun run scripts/ensure-test-user.ts


      - name: Start dev server
        run: |
          nohup bun run dev > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          # Espera hasta que localhost:8080 responda (máx 90s)
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "dev server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev server never came up"
          tail -n 200 /tmp/vite.log
          exit 1

      - name: Run E2E — wardrobe AI flow
        run: python tests/e2e/wardrobe-ai-flow.spec.py

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/vite.pid ]; then kill "$(cat /tmp/vite.pid)" 2>/dev/null || true; fi

      - name: Upload screenshots + vite log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wardrobe-ai-e2e-artifacts
          path: |
            tests/e2e/screenshots/wardrobe-ai-flow/**
            /tmp/vite.log
          if-no-files-found: ignore
          retention-days: 7
